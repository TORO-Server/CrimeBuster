name: ci

# main へのプッシュとタグ (v*) で、試験に通ったイメージを GHCR (ghcr.io/<owner>/<repo>) に置く。プルリクエストは試験とビルドだけ (置かない)
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - run: test -z "$(gofmt -l .)"

      - run: go vet ./...

      - run: go test -race ./...

      # 既知の脆弱性 (Go の脆弱性データベース)。実際に呼んでいる関数に届くものだけを報告する
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # GHCR の名前は小文字だけ
      - name: image name
        run: echo "IMAGE=ghcr.io/toro-server/crime-buster" >> "$GITHUB_ENV"

      # イメージへ入れる実行ファイルの版。タグ (v*) のときはタグの名前から、それ以外はコミットの短いハッシュから決める
      - name: version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.ver.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # イメージの中の実行ファイルが、渡した版を返すことを確かめる
      - name: verify version in image
        run: |
          docker buildx build --load -t crime-buster-verify --build-arg VERSION=${{ steps.ver.outputs.VERSION }} .
          test "$(docker run --rm crime-buster-verify version)" = "${{ steps.ver.outputs.VERSION }}"

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 設定リファレンスとコードの照合、用語の再混入の検査 (Python の標準ライブラリだけ)
      - run: python3 scripts/check-docs.py
